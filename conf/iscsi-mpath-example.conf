# iSCSI Multipath Connection Configuration
# Copy this file to /etc/iscsi-mpath/<storage-name>.conf
# Then enable the service: systemctl enable --now iscsi-mpath-connect@<storage-name>

# Target IQN (required)
TARGET_IQN="iqn.2024-01.com.example:storage"

# Target portal addresses, comma-separated for multipath (required)
# For multipath, specify multiple portals from different paths
PORTALS="192.168.1.100,192.168.1.101"

# Target port (default: 3260)
PORT=3260

# CHAP Authentication (optional)
# Leave empty if not using CHAP
USERNAME=""
PASSWORD=""

# iSCSI node startup mode (default: automatic)
# Options: automatic, manual, onboot
STARTUP="automatic"

# Host network interfaces, comma-separated (optional)
# Use this to bind connections to specific network interfaces
# Example: "eth0,eth1" for multipath over two interfaces
HOST_IFACE=""

