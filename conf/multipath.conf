# Configured by Proxmox iSCSI Multipath Plugin
# This file is installed to /etc/multipath.conf by the plugin installer
#
# Key settings:
# - find_multipaths no: Always create multipath devices (don't wait for multiple paths)
# - Blacklist all devices by default, whitelist only iSCSI
# - Use service-time path selector for optimal performance

defaults {
    # Don't wait for multiple paths - always create multipath device
    find_multipaths no

    # Default path selector - choose path with best estimated service time
    path_selector "service-time 0"

    # Default path grouping - one active path, others on standby
    path_grouping_policy failover

    # Queue I/O when all paths fail (set to 'fail' for immediate error)
    no_path_retry queue

    # Fail back to preferred path when it recovers
    failback immediate

    # Polling interval for path checking (seconds)
    polling_interval 5

    # Path checker method
    path_checker tur

    # Enable automatic path recovery
    features "1 queue_if_no_path"

    # Use WWID as device name (e.g., /dev/mapper/3600508b4...)
    # Set to 'yes' for friendly names like mpatha, mpathb
    user_friendly_names no
}

# Blacklist all devices by default
# Use device vendor/product matching so exceptions can override
blacklist {
    device {
        vendor ".*"
        product ".*"
    }
}

# Whitelist iSCSI storage devices by vendor/product
blacklist_exceptions {
    # Pure Storage FlashArray
    device {
        vendor "PURE"
        product ".*"
    }
    device {
        vendor ".*"
        product "FlashArray"
    }
    # NetApp
    device {
        vendor "NETAPP"
        product ".*"
    }
    # EMC/Dell
    device {
        vendor "EMC"
        product ".*"
    }
    device {
        vendor "DGC"
        product ".*"
    }
    device {
        vendor "COMPELNT"
        product ".*"
    }
    device {
        vendor "DELL"
        product ".*"
    }
    # HPE/HP
    device {
        vendor "3PARdata"
        product ".*"
    }
    device {
        vendor "HP"
        product ".*"
    }
    device {
        vendor "HPE"
        product ".*"
    }
    device {
        vendor "Nimble"
        product ".*"
    }
    # Linux iSCSI targets
    device {
        vendor "LIO-ORG"
        product ".*"
    }
    device {
        vendor "IET"
        product ".*"
    }
    device {
        vendor "TrueNAS"
        product ".*"
    }
    device {
        vendor "FreeNAS"
        product ".*"
    }
    # NAS vendors
    device {
        vendor "SYNOLOGY"
        product ".*"
    }
    device {
        vendor "QNAP"
        product ".*"
    }
    # Other enterprise
    device {
        vendor "XTREMIO"
        product ".*"
    }
    device {
        vendor "SolidFir"
        product ".*"
    }
    device {
        vendor "HUAWEI"
        product ".*"
    }
    device {
        vendor "STARWIND"
        product ".*"
    }
    device {
        vendor "Infinidat"
        product ".*"
    }
    device {
        vendor "HITACHI"
        product ".*"
    }
    device {
        vendor "IBM"
        product ".*"
    }
    # Generic/testing
    device {
        vendor "SCST_BIO"
        product ".*"
    }
    device {
        vendor "Generic"
        product ".*"
    }
}

# Per-device overrides can be added in /etc/multipath/conf.d/*.conf
# The plugin automatically creates per-device configs there when
# mpath_policy, mpath_selector, or mpath_no_path_retry are set

